name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify complete workspace archive
        id: workspace
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f pnpm-workspace.yaml && -d apps/mobile && -d packages/domain ]]; then
            echo "root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::The checkout does not contain the Winter Arc monorepo root, packages/domain, and apps/mobile together. The current local Git root is nested in apps/mobile, so a clean CI/EAS checkout cannot resolve @winter-arc/domain. Promote the workspace root to the repository root, then move this workflow to <workspace>/.github/workflows/quality-gate.yml. See RELEASE_CREDENTIALS_RUNBOOK.md."
          exit 1

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: ${{ steps.workspace.outputs.root }}
        run: pnpm install --frozen-lockfile

      - name: Run complete validation
        working-directory: ${{ steps.workspace.outputs.root }}
        run: pnpm validate
